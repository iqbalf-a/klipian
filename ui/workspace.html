<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>klipian — workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap" rel="stylesheet">
<!-- tokens.css is loaded FIRST -- css/workspace.css just points to the custom
     properties defined there (see tailwind.config.js). -->
<link rel="stylesheet" href="/ui/css/tokens.css">
<link rel="stylesheet" href="/ui/css/workspace.css">
</head>
<body>

<div class="flex flex-col min-h-screen">

  <header class="flex items-center gap-4 h-[58px] px-5 shrink-0
                  bg-surface-1 border-b border-glass-border">
    <a class="text-text font-extrabold no-underline hover:text-accent"
       style="font-stretch:118%" href="/" title="Back to editor">klipian</a>
    <a class="text-text-faint text-[12px] hover:text-text" href="/" title="Back to editor">← Editor</a>
    <span class="font-data text-[11px] text-text-faint">/ workspace</span>
    <span class="ml-auto font-data text-[12px] text-text-faint" id="wsClock"></span>
  </header>

  <main class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-6 p-6
               max-w-[1400px] w-full mx-auto">

    <!-- ══════════════════ CLIPS — upload schedule & status ══════════════════
         Replaces workspace/schedule/content-calendar.xlsx: same content (1 row =
         1 clip), but stored in clips.json via /api/workspace/clips so it can
         be edited directly from here instead of opening a separate Excel. -->
    <section class="ws-panel" id="panelClips">
      <div class="flex items-center gap-3">
        <h1 class="text-[20px] font-extrabold tracking-tight" style="font-stretch:112%">Clips</h1>
        <span class="text-text-faint text-[13px]" id="clipSummary">loading…</span>
        <button class="ml-auto rounded-s bg-accent text-[13px] font-semibold px-3 py-1.5
                       text-[oklch(0.145_0.010_258)] hover:brightness-110"
                id="addClipBtn" type="button">+ New clip</button>
      </div>
      <!-- Only the columns that are useful at a glance: status, title, platform,
           schedule. The rest (source episode, file, description, caption, link,
           notes) moved to a per-row "Detail" dialog -- the full 13 columns used
           to make the table 1700px wide and require horizontal scrolling just
           to see the next row. -->
      <div class="overflow-x-auto rounded-m">
        <table class="w-full border-collapse text-[13px]" id="clipTable">
          <thead>
            <tr>
              <th class="sticky top-0 z-10 bg-surface-2 text-left text-[10px] font-bold
                         uppercase tracking-wider text-text-faint px-3 py-2 border-b border-glass-border"
                  style="width:110px">Status</th>
              <th class="sticky top-0 z-10 bg-surface-2 text-left text-[10px] font-bold
                         uppercase tracking-wider text-text-faint px-3 py-2 border-b border-glass-border">Title / hook</th>
              <th class="sticky top-0 z-10 bg-surface-2 text-left text-[10px] font-bold
                         uppercase tracking-wider text-text-faint px-3 py-2 border-b border-glass-border"
                  style="width:150px">Platform</th>
              <th class="sticky top-0 z-10 bg-surface-2 text-left text-[10px] font-bold
                         uppercase tracking-wider text-text-faint px-3 py-2 border-b border-glass-border"
                  style="width:130px">Upload date</th>
              <th class="sticky top-0 z-10 bg-surface-2 text-left text-[10px] font-bold
                         uppercase tracking-wider text-text-faint px-3 py-2 border-b border-glass-border"
                  style="width:90px">Time</th>
              <th class="sticky top-0 z-10 bg-surface-2 border-b border-glass-border" style="width:80px"></th>
              <th class="sticky top-0 z-10 bg-surface-2 border-b border-glass-border" style="width:36px"></th>
            </tr>
          </thead>
          <tbody id="clipBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Fields that don't fit / don't need to always be visible in the table
         above. Native browser <dialog>: backdrop + Esc-to-close + focus trap
         for free, no need for custom overlay code. Title is shown as context
         ONLY (read-only) -- edited from the table so there aren't two sources
         of truth for the same field. -->
    <dialog class="ws-dialog" id="clipDetailDialog">
      <form method="dialog" class="flex flex-col gap-4" id="clipDetailForm">
        <div class="flex items-start gap-3">
          <h2 class="text-[15px] font-extrabold leading-tight" id="clipDetailTitle">Clip details</h2>
          <button class="ml-auto delete-btn" type="submit" value="cancel" title="Close">✕</button>
        </div>
        <label class="ws-field">Source episode
          <input class="ws-input" type="text" data-field="episode"></label>
        <label class="ws-field">Clip file
          <input class="ws-input" type="text" data-field="file"></label>
        <label class="ws-field">Description + hashtags (YouTube)
          <textarea class="ws-input" rows="3" data-field="description"></textarea></label>
        <label class="ws-field">TikTok caption
          <textarea class="ws-input" rows="3" data-field="tiktokCaption"></textarea></label>
        <label class="ws-field">YouTube link
          <input class="ws-input" type="url" data-field="youtubeUrl"></label>
        <label class="ws-field">TikTok link
          <input class="ws-input" type="url" data-field="tiktokUrl"></label>
        <label class="ws-field">Notes
          <textarea class="ws-input" rows="2" data-field="notes"></textarea></label>
        <div class="flex gap-2 justify-end">
          <button class="rounded-s px-3 py-1.5 text-[13px] border border-glass-border hover:bg-glass"
                  type="submit" value="cancel">Close</button>
          <button class="rounded-s bg-accent text-[13px] font-semibold px-3 py-1.5
                         text-[oklch(0.145_0.010_258)] hover:brightness-110"
                  type="submit" value="save">Save</button>
        </div>
      </form>
    </dialog>

    <!-- ══════════════════ RENDERED OUTPUT — out/ contents as-is ══════════════════
         Same data source as /api/history (used by the History screen in the
         editor) -- just displayed again here, no new endpoint, so there's
         no second definition of "what's been rendered". -->
    <section class="ws-panel" id="panelRender">
      <div class="flex items-center gap-3">
        <h1 class="text-[20px] font-extrabold tracking-tight" style="font-stretch:112%">Rendered output</h1>
        <span class="text-text-faint text-[13px]" id="renderNote">loading…</span>
      </div>
      <div id="renderList"></div>
    </section>

    <!-- ══════════════════ ASSETS — workspace/assets/ ══════════════════
         Empty by default. Where to put custom watermark/font/template files
         outside klipian's built-in ones (assets/ at root, used by the app itself). -->
    <section class="ws-panel" id="panelAssets">
      <div class="flex items-center gap-3">
        <h1 class="text-[20px] font-extrabold tracking-tight" style="font-stretch:112%">Assets</h1>
        <span class="text-text-faint text-[13px]" id="assetNote">loading…</span>
      </div>
      <div id="assetList"></div>
    </section>

  </main>
</div>

<script src="/ui/js/workspace/helpers.js"></script>
<script src="/ui/js/workspace/clips.js"></script>
<script src="/ui/js/workspace/render.js"></script>
<script src="/ui/js/workspace/assets.js"></script>
</body>
</html>
